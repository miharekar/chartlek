# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

<% sync_hours = Integer(ENV["GARMIN_SYNC_HOURS"].presence || 3) %>
<% raise ArgumentError, "GARMIN_SYNC_HOURS must be a whole number from 1 to 24, got #{sync_hours}" unless (1..24).cover?(sync_hours) %>
production:
  garmin_sync:
    class: Activity::SyncJob
    schedule: every <%= sync_hours %> hours
  wellness_sync:
    class: Wellness::SyncJob
    schedule: every hour at minute 30
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
